            saveDatabase: async function() {
                this.ensureIntegrity();
                const obj = appState.dbData;

                const vRes = validateDocument(obj);
                if (!vRes.valid) {
                    const msg = vRes.errors.map(e => `• [Code ${e.code}] ${e.message}`).join("\n");
                    if (!confirm(`Warning: Document has validation issues:\n${msg}\n\nDo you still want to proceed with saving?`)) {
                        return;
                    }
                }

                const content = JSON.stringify(obj, null, 2);
                if (appState.fileHandle) {
                    try {
                        const w = await appState.fileHandle.createWritable();
                        await w.write(content);
                        await w.close();
                        this.markClean();
                    } catch(e) {
                        console.error("Save failed:", e);
                        this.downloadFile(appState.fileName || 'database.bejson', content);
                        this.markClean();
                    }
                } else {
                    this.downloadFile(appState.fileName || 'database.bejson', content);
                    this.markClean();
                }
            },

            saveDatabaseAs: async function() {
                if (typeof window.showSaveFilePicker === 'function') {
                    try {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: appState.fileName || 'database.bejson',
                            types: [{ description: 'BEJSON File', accept: BEJSON_ACCEPT }]
                        });
                        appState.fileHandle = handle;
                        appState.fileName   = handle.name;
                        await this.saveDatabase();
                        return true;
                    } catch(e) {
                        if (e && e.name === 'AbortError') return false;
                    }
                }

                const chosen = await this.showLargeInput("Save As", "Enter filename:", appState.fileName || 'database.bejson');
                if (!chosen) return false;
                appState.fileName = chosen.endsWith('.bejson') || chosen.endsWith('.json') ? chosen : chosen + '.bejson';
                appState.fileHandle = null;
                await this.saveDatabase();
                return true;
            },

            downloadFile: function(filename, content) {
                const a = Object.assign(document.createElement('a'), {
                    href: URL.createObjectURL(new Blob([content], {type:'application/json'})),
                    download: filename
                });
                a.click();
                URL.revokeObjectURL(a.href);
            },

            execRtAction: function(rt) {
                const act = document.getElementById('act-' + rt).value;
                if      (act === 'view')   this.renderRecordEditor(rt);
                else if (act === 'export') this.export104(rt);
                else if (act === 'rename') this.renameRt(rt);
                else if (act === 'delete') this.deleteRt(rt);
            },

            export104: function(rt) {
                const out = {
                    "Format": "BEJSON",
                    "Format_Version": "104",
                    "Format_Creator": appState.dbData.Format_Creator || "Elton Boehnen",
                    "Records_Type": [rt],
                    "Fields": [],
                    "Values": []
                };
                const idx = [];
                appState.dbData.Fields.forEach((f, i) => {
                    if (f.name === 'Record_Type_Parent') return;
                    if (f.Record_Type_Parent === rt) {
                        idx.push(i);
                        out.Fields.push({ name: f.name, type: f.type });
                    }
                });
                const ri = this.getFieldIndex('Record_Type_Parent');
                appState.dbData.Values.forEach(row => {
                    if (row[ri] === rt) out.Values.push(idx.map(i => row[i]));
                });
                this.downloadFile(`${rt}_export.bejson`, JSON.stringify(out, null, 2));
            },

            import104Action: async function() {
                if (appState.is104Mode) return alert("Cannot import into a single-type 104 file.");
                try {
                    let file = null, text = null;
                    if (typeof window.showOpenFilePicker === 'function') {
                        try {
                            const [handle] = await window.showOpenFilePicker({
                                types: [{ description: 'BEJSON 104', accept: BEJSON_ACCEPT }]
                            });
                            file = await handle.getFile();
                            text = await file.text();
                        } catch (fsaErr) {
                            if (fsaErr && fsaErr.name === 'AbortError') return;
                            const res = await this.fileInputFallback();
                            file = res.file; text = res.text;
                        }
                    } else {
                        const res = await this.fileInputFallback();
                        file = res.file; text = res.text;
                    }

                    if (!text) return;
                    const imp = JSON.parse(text);

                    const vRes = validateDocument(imp);
                    if (!vRes.valid) return alert("Invalid BEJSON file:\n" + vRes.errors.map(e => e.message).join("\n"));
                    if (imp.Format_Version !== "104" && imp.Format_Version !== "104a") return alert("Version must be 104 or 104a.");
                    if (!imp.Records_Type || imp.Records_Type.length !== 1) return alert("Import file must have exactly one Record Type.");

                    const importRt = imp.Records_Type[0];
                    if (appState.dbData.Records_Type.includes(importRt)) return alert(`Record Type '${importRt}' already exists.`);

                    appState.dbData.Records_Type.push(importRt);
                    const colIndices = [];
                    imp.Fields.forEach((f) => {
                        if (f.name === 'Record_Type_Parent') return;
                        appState.dbData.Fields.push({
                            name: f.name,
                            type: f.type,
                            Record_Type_Parent: importRt
                        });
                        const newColIdx = appState.dbData.Fields.length - 1;
                        colIndices.push(newColIdx);
                        appState.dbData.Values.forEach(r => r.push(null));
                    });

                    const ri = this.getFieldIndex('Record_Type_Parent');
                    const totalCols = appState.dbData.Fields.length;
                    imp.Values.forEach(row => {
                        const nr = new Array(totalCols).fill(null);
                        nr[ri] = importRt;
                        row.forEach((v, i) => {
                            if (i < colIndices.length) nr[colIndices[i]] = v;
                        });
                        appState.dbData.Values.push(nr);
                    });

                    this.ensureIntegrity();
                    await this.saveDatabase();
                    this.renderDatabaseHub();
                    alert(`Imported '${importRt}' with ${imp.Values.length} records.`);
                } catch(e) {
                    if (e.name !== 'AbortError') {
                        console.error(e);
                        alert("Import failed: " + e.message);
                    }
                }
            },

            execEditorAction: async function() {
                const sel = document.getElementById('editor-action');
                const act = sel ? sel.value : '';
                const rt  = appState.activeRecordType;

                if (act === 'Add New Record') {
                    if (appState.is104Mode) {
                        const row = new Array(appState.dbData.Fields.length).fill(null);
                        appState.dbData.Values.push(row);
                    } else {
                        const ri  = this.getFieldIndex('Record_Type_Parent');
                        const row = new Array(appState.dbData.Fields.length).fill(null);
                        row[ri] = rt;
                        appState.dbData.Values.push(row);
                    }
                    await this.saveAndRefresh();

                } else if (act === 'Delete Selected Record(s)') {
                    const checks = document.querySelectorAll('.rec-chk:checked');
                    if (!checks.length) return alert("Select records first.");
                    if (!confirm(`Delete ${checks.length} record${checks.length > 1 ? 's' : ''}?`)) return;
                    const del = new Set(Array.from(checks).map(c => +c.dataset.idx));
                    appState.dbData.Values = appState.dbData.Values.filter((_, i) => !del.has(i));
                    await this.saveAndRefresh();

                } else if (act === 'Duplicate Selected Record') {
                    const checks = document.querySelectorAll('.rec-chk:checked');
                    if (!checks.length) return alert("Select a record first.");
                    Array.from(checks).map(c => +c.dataset.idx)
                        .forEach(i => appState.dbData.Values.push([...appState.dbData.Values[i]]));
                    await this.saveAndRefresh();

                } else if (act === 'Copy Active Value') {
                    const el = document.activeElement;
                    if (el && el.classList.contains('cell-input')) {
                        try { await navigator.clipboard.writeText(el.value); alert("Copied!"); }
                        catch(e) { alert("Error: " + e); }
                    } else alert("Click a cell first.");

                } else if (act === 'Paste to Active') {
                    const el = document.activeElement;
                    if (el && el.classList.contains('cell-input')) {
                        try { const t = await navigator.clipboard.readText(); el.value = t; el.dispatchEvent(new Event('change')); }
                        catch(e) { alert("Clipboard blocked. Use Ctrl+V."); }
                    } else alert("Click a cell first.");

                } else if (act === 'Reset Sort & Pin') {
                    this.resetView();

                } else if (act === 'Add Field') {
                    this.showFieldDialog(null);

                } else if (act === 'Edit Selected Field') {
                    if (appState.selectedFieldIdx === null) return alert("Click a column header first.");
                    const f = appState.dbData.Fields[appState.selectedFieldIdx];
                    if (f.name === 'Record_Type_Parent') return alert("Cannot edit Record_Type_Parent discriminator.");
                    this.showFieldDialog(f, appState.selectedFieldIdx);

                } else if (act === 'Delete Selected Field') {
                    if (appState.selectedFieldIdx === null) return alert("Click a column header first.");
                    const f = appState.dbData.Fields[appState.selectedFieldIdx];
                    if (f.name === 'Record_Type_Parent') return alert("Cannot delete Record_Type_Parent discriminator.");
                    if (!confirm(`Delete field '${f.name}'?`)) return;
                    appState.dbData.Fields.splice(appState.selectedFieldIdx, 1);
                    appState.dbData.Values.forEach(row => row.splice(appState.selectedFieldIdx, 1));
                    appState.selectedFieldIdx = null;
                    await this.saveAndRefresh();

                } else if (act === 'View Schema') {
                    this.showSchemaView();
                } else if (act === 'Export to BEJSON 104') {
                    this.export104(rt);
                } else if (act === 'Save As...') {
                    await this.saveDatabaseAs();
                } else if (act === 'Manage Headers') {
                    this.manageHeadersAction();
                } else if (act === 'App Info') {
                    this.showAppInfo();
                }

                if (sel) sel.value = '';
            },

            sortData: function(colIdx, asc) {
                appState.pinnedFieldIdx = colIdx;
                appState.sortAsc = asc;
                const type = appState.dbData.Fields[colIdx].type;

                const comparator = (a, b) => {
                    let vA = a[colIdx], vB = b[colIdx];
                    if (vA == null) vA = (type === 'number' || type === 'integer') ? -Infinity : "";
                    if (vB == null) vB = (type === 'number' || type === 'integer') ? -Infinity : "";
                    if (type === 'number' || type === 'integer') return asc ? vA - vB : vB - vA;
                    if (type === 'boolean') return asc ? Number(vA) - Number(vB) : Number(vB) - Number(vA);
                    return asc
                        ? String(vA).localeCompare(String(vB), undefined, {numeric:true, sensitivity:'base'})
                        : String(vB).localeCompare(String(vA), undefined, {numeric:true, sensitivity:'base'});
                };

                if (appState.is104Mode) {
                    appState.dbData.Values.sort(comparator);
                } else {
                    const ri = this.getFieldIndex('Record_Type_Parent');
                    const rt = appState.activeRecordType;
                    let typeRows = [], otherRows = [];
                    appState.dbData.Values.forEach(row => (row[ri] === rt ? typeRows : otherRows).push(row));
                    typeRows.sort(comparator);
                    appState.dbData.Values = [...otherRows, ...typeRows];
                }

                this.saveDatabase();
                this.renderRecordEditor(appState.activeRecordType);
            },

            resetView: function() {
                appState.pinnedFieldIdx = null;
                this.renderRecordEditor(appState.activeRecordType);
            },

            saveField: async function(idx) {
                const nameInput = document.getElementById('fd-name').value;
                const type      = document.getElementById('fd-type').value;
                const mapEl     = document.getElementById('fd-map');
                const map       = mapEl ? mapEl.value : null;

                if (appState.is104aMode && (type === 'array' || type === 'object')) {
                    return alert("Complex types (array/object) are forbidden in BEJSON 104a. Use primitive types only.");
                }
                if (!nameInput.trim()) return alert("Field name is required.");

                const names = nameInput.split(',').map(n => n.trim()).filter(Boolean);
                if (!names.length) return alert("Invalid field name(s).");

                if (idx !== null) {
                    if (names.length > 1) return alert("Cannot rename to multiple fields.");
                    const name = names[0];
                    if (name === "Record_Type_Parent" && !appState.is104Mode) {
                        return alert("Field name 'Record_Type_Parent' is reserved in 104db.");
                    }
                    const nf = { name, type };
                    if (!appState.is104Mode && map) nf.Record_Type_Parent = map;
                    appState.dbData.Fields[idx] = nf;
                } else {
                    names.forEach(name => {
                        if (name === "Record_Type_Parent") {
                            return alert("Field name 'Record_Type_Parent' is reserved.");
                        }
                        const exists = appState.dbData.Fields.find(f => f.name === name && (appState.is104Mode || f.Record_Type_Parent === map));
                        if (!exists) {
                            const nf = { name, type };
                            if (!appState.is104Mode && map) nf.Record_Type_Parent = map;
                            appState.dbData.Fields.push(nf);
                            appState.dbData.Values.forEach(r => r.push(null));
                        }
                    });
                }

                this.ensureIntegrity();
                this.closeModal();
                await this.saveAndRefresh();
            },

            encryptAction: async function() {
                if (!appState.dbData) return alert("Load a DB first.");
                const pwd = await this.showLargeInput("Encrypt", "Enter Password:");
                if (!pwd) return;
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv   = crypto.getRandomValues(new Uint8Array(12));
                const key  = await this.deriveKey(pwd, salt);
                const ct   = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(appState.dbData)));
                this.downloadFile(
                    (appState.fileName || "db").replace('.bejson', '.bjsenc'),
                    JSON.stringify({encryptionFormat:ENCRYPTION_ID, salt:this.ab2base64(salt), iv:this.ab2base64(iv), ciphertext:this.ab2base64(ct)}, null, 2)
                );
            },

            decryptAction: async function() {
                try {
                    let file = null, text = null, fileName = null;
                    if (typeof window.showOpenFilePicker === 'function') {
                        try {
                            const [handle] = await window.showOpenFilePicker({
                                types: [{ description: 'Encrypted BEJSON', accept: {'application/json': ['.bjsenc']} }]
                            });
                            file = await handle.getFile();
                            fileName = file.name;
                            text = await file.text();
                        } catch (fsaErr) {
                            if (fsaErr && fsaErr.name === 'AbortError') return;
                            const res = await this.fileInputFallback('.bjsenc,.json,application/json');
                            file = res.file; text = res.text; fileName = file.name;
                        }
                    } else {
                        const res = await this.fileInputFallback('.bjsenc,.json,application/json');
                        file = res.file; text = res.text; fileName = file.name;
                    }

                    if (!text) return;
                    const pkg = JSON.parse(text);

                    if (pkg.encryptionFormat !== ENCRYPTION_ID) return alert("Invalid encryption format.");
                    const pwd = await this.showLargeInput("Decrypt", "Enter Password:");
                    if (!pwd) return;
                    try {
                        const key = await this.deriveKey(pwd, this.base642ab(pkg.salt));
                        const dec = await crypto.subtle.decrypt({name:"AES-GCM", iv:this.base642ab(pkg.iv)}, key, this.base642ab(pkg.ciphertext));
                        appState.dbData     = JSON.parse(new TextDecoder().decode(dec));
                        appState.fileName   = fileName.replace('.bjsenc','_decrypted.bejson');
                        appState.fileHandle = null;
                        this.markClean();

                        const ver = appState.dbData.Format_Version || "";
                        if (ver === "104db") {
                            appState.is104Mode = false; appState.is104aMode = false;
                            this.migrateLegacyData(); this.ensureIntegrity(); this.renderDatabaseHub();
                        } else if (ver === "104" || ver === "104a") {
                            appState.is104Mode = true; appState.is104aMode = (ver === "104a");
                            appState.originalVersion = ver;
                            const rt = appState.dbData.Records_Type[0]; appState.activeRecordType = rt;
                            this.ensureIntegrity(); this.renderRecordEditor(rt);
                        } else {
                            this.ensureIntegrity(); this.renderDatabaseHub();
                        }
                        alert("Decrypted successfully.");
                    } catch(e) { alert("Decryption failed. Wrong password?"); }
                } catch(e) { if (e.name !== 'AbortError') console.error(e); }
            },

            deriveKey: async function(pwd, salt) {
                const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pwd), {name:"PBKDF2"}, false, ["deriveKey"]);
                return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:100000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
            },

            ab2base64: function(buf) {
                const b = new Uint8Array(buf); let s = '';
                for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
                return btoa(s);
            },
            base642ab: function(b64) {
                const s = atob(b64); return new Uint8Array(s.length).map((_, i) => s.charCodeAt(i));
            },

            ensureIntegrity: function() {
                const d = appState.dbData;
                if (!d) return;
                const ver = d.Format_Version || "";

                if (ver === "104db") {
                    if (!d.Fields.length || d.Fields[0].name !== 'Record_Type_Parent') {
                        const rtpIdx = d.Fields.findIndex(f => f.name === 'Record_Type_Parent');
                        if (rtpIdx > -1) {
                            const [rtpField] = d.Fields.splice(rtpIdx, 1);
                            d.Fields.unshift(rtpField);
                            d.Values.forEach(row => {
                                const [val] = row.splice(rtpIdx, 1);
                                row.unshift(val);
                            });
                        } else {
                            d.Fields.unshift({ name: 'Record_Type_Parent', type: 'string' });
                            const defType = d.Records_Type[0] || 'DefaultType';
                            d.Values.forEach(row => row.unshift(defType));
                        }
                    }

                    const validTypes = new Set(d.Records_Type);
                    const defType = d.Records_Type[0] || 'DefaultType';
                    d.Fields.forEach((f, idx) => {
                        if (idx > 0 && (!f.Record_Type_Parent || !validTypes.has(f.Record_Type_Parent))) {
                            f.Record_Type_Parent = defType;
                        }
                    });

                    const fieldCount = d.Fields.length;
                    d.Values.forEach((row, i) => {
                        while (row.length < fieldCount) row.push(null);
                        if (row.length > fieldCount) d.Values[i] = row.slice(0, fieldCount);
                        if (!validTypes.has(row[0])) row[0] = defType;
                    });

                    Object.keys(d).forEach(k => {
                        if (!MANDATORY_HEADERS.has(k)) delete d[k];
                    });

                } else if (ver === "104" || ver === "104a") {
                    const rtpIdx = d.Fields.findIndex(f => f.name === 'Record_Type_Parent');
                    if (rtpIdx > -1) {
                        d.Fields.splice(rtpIdx, 1);
                        d.Values.forEach(row => row.splice(rtpIdx, 1));
                    }
                    d.Fields.forEach(f => {
                        delete f.Record_Type_Parent;
                    });

                    if (!Array.isArray(d.Records_Type) || d.Records_Type.length === 0) {
                        d.Records_Type = ["DefaultType"];
                    } else if (d.Records_Type.length > 1) {
                        d.Records_Type = [d.Records_Type[0]];
                    }

                    const fieldCount = d.Fields.length;
                    d.Values.forEach((row, i) => {
                        while (row.length < fieldCount) row.push(null);
                        if (row.length > fieldCount) d.Values[i] = row.slice(0, fieldCount);
                    });

                    if (ver === "104") {
                        Object.keys(d).forEach(k => {
                            if (!MANDATORY_HEADERS.has(k) && k !== "Parent_Hierarchy") {
                                delete d[k];
                            }
                        });
                    } else if (ver === "104a") {
                        d.Fields.forEach(f => {
                            if (!PRIMITIVE_FIELD_TYPES.includes(f.type)) {
                                f.type = "string";
                            }
                        });
                    }
                }
            },

            getFieldIndex: function(name) { return bejson_core_get_field_index(appState.dbData, name); },

            getRecordCounts: function() {
                const counts = {};
                if (appState.is104Mode) {
                    const rt = appState.dbData.Records_Type[0] || 'DefaultType';
                    counts[rt] = appState.dbData.Values.length;
                } else {
                    const ri = this.getFieldIndex('Record_Type_Parent');
                    appState.dbData.Values.forEach(row => {
                        const t = row[ri];
                        if (t && t !== '__DATABASE_METADATA__') counts[t] = (counts[t] || 0) + 1;
                    });
                }
                return counts;
            },

            addRecordTypeDialog: async function() {
                const name = await this.showLargeInput("Add Record Type", "Enter new record type name:");
                if (!name) return;
                const t = name.trim();
                if (!t) return;
                if (appState.dbData.Records_Type.includes(t)) return alert("Record type already exists.");
                appState.dbData.Records_Type.push(t);
                await this.saveDatabase();
                this.renderDatabaseHub();
            },

            renameRt: async function(oldName) {
                const newName = await this.showLargeInput("Rename", `Rename '${oldName}' to:`);
                if (!newName || newName === oldName) return;
                const ri = this.getFieldIndex('Record_Type_Parent');
                appState.dbData.Records_Type = appState.dbData.Records_Type.map(r => r === oldName ? newName : r);
                appState.dbData.Fields.forEach(f => { if (f.Record_Type_Parent === oldName) f.Record_Type_Parent = newName; });
                appState.dbData.Values.forEach(row => { if (row[ri] === oldName) row[ri] = newName; });
                await this.saveDatabase();
                this.renderDatabaseHub();
            },

            deleteRt: async function(rt) {
                if (appState.dbData.Records_Type.length <= 2) {
                    return alert("BEJSON 104db requires at least 2 record types. Cannot delete below 2.");
                }
                if (!confirm(`Delete '${rt}' and ALL its data?`)) return;
                const ri = this.getFieldIndex('Record_Type_Parent');
                appState.dbData.Values = appState.dbData.Values.filter(r => r[ri] !== rt);
                appState.dbData.Records_Type = appState.dbData.Records_Type.filter(t => t !== rt);
                appState.dbData.Fields = appState.dbData.Fields.filter(f => f.name === 'Record_Type_Parent' || f.Record_Type_Parent !== rt);
                await this.saveDatabase();
                this.renderDatabaseHub();
            },

            clearTopBar: function() {
                document.getElementById('top-bar-left').innerHTML  = '<button id="hamburger-btn" onclick="app.openSidebar()" title="Menu"><span class="hbar"></span><span class="hbar"></span><span class="hbar"></span></button><div id="app-title">BEJSON Editor</div><span class="dirty-dot" id="dirty-dot" title="Unsaved changes pending">●</span>';
                document.getElementById('top-bar-right').innerHTML = '';
                if (appState.isDirty) document.getElementById('dirty-dot').classList.add('visible');
                const fnEl = document.getElementById('sb-filename');
                const fnTx = document.getElementById('sb-filename-text');
                if (appState.fileName) { fnEl.style.display = ''; fnTx.textContent = appState.fileName; }
                else { fnEl.style.display = 'none'; }
            },
            setTopTitle: function(txt)   { const e = document.getElementById('app-title'); if (e) e.innerText = txt; },
            addTopBtn:   function(text, cls, onClick, prepend = false) {
                const btn = document.createElement('button');
                btn.className = "btn " + cls; btn.innerText = text; btn.onclick = onClick;
                const c = document.getElementById(prepend ? 'top-bar-left' : 'top-bar-right');
                if (prepend) c.insertBefore(btn, c.firstChild); else c.appendChild(btn);
            },
            addTopText: function(txt) {
                const d = document.createElement('div');
                d.style.cssText = "font-size:17px; font-weight:bold;"; d.innerText = txt;
                document.getElementById('top-bar-left').appendChild(d);
            },
            toggleSysFields: function(show) { appState.showSysFields = show; this.renderRecordEditor(appState.activeRecordType); },
            selectField:     function(idx)  {
                appState.selectedFieldIdx = idx;
                document.querySelectorAll('.header-btn').forEach(b => b.classList.remove('selected'));
                const h = document.getElementById('hdr-' + idx); if (h) h.classList.add('selected');
            },
            updateValue: function(rowIdx, colIdx, val) {
                appState.dbData.Values[rowIdx][colIdx] = (val === '' ? null : val);
                this.markDirty();
                this.saveDatabase();
            },
            saveAndRefresh: async function() { await this.saveDatabase(); this.renderRecordEditor(appState.activeRecordType); },
            toggleSelectAll:  function(checked) { document.querySelectorAll('.rec-chk').forEach(c => c.checked = checked); },

            openSidebar: function() {
                document.getElementById('sidebar').classList.add('open');
                document.getElementById('sidebar-backdrop').classList.add('on');
            },
            closeSidebar: function() {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebar-backdrop').classList.remove('on');
            },
            updateSidebarNav: function(items) {
                const nav = document.getElementById('sb-nav');
                nav.innerHTML = '';
                items.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'sb-nav-btn' + (item.red ? ' red' : '');
                    btn.textContent = item.label;
                    btn.onclick = item.action;
                    nav.appendChild(btn);
                });
            },

            sfOpenPath: function(path, rowIdx, colIdx, fieldName) {
                try { window.open(path, '_blank'); } catch(e) {}
            },

            sfOpenImage: function(path, fieldColIdx) {
                let paths = [];
                if (appState.is104Mode) {
                    paths = appState.dbData.Values
                        .map(row => row[fieldColIdx])
                        .filter(v => v !== null && v !== undefined && v !== '');
                } else {
                    const rt    = appState.activeRecordType;
                    const ri    = this.getFieldIndex('Record_Type_Parent');
                    paths = appState.dbData.Values
                        .filter(row => row[ri] === rt)
                        .map(row => row[fieldColIdx])
                        .filter(v => v !== null && v !== undefined && v !== '');
                }
                const idx = paths.indexOf(path);
                this.lbOpen(paths, idx < 0 ? 0 : idx);
            },

            _lb: { paths: [], idx: 0 },

            lbOpen: function(paths, idx) {
                this._lb.paths = paths; this._lb.idx = idx;
                document.getElementById('bej-lightbox').classList.add('on');
                this.lbRender();
            },
            lbClose: function() {
                document.getElementById('bej-lightbox').classList.remove('on');
                document.getElementById('bej-lb-img').src = '';
            },
            lbNav: function(dir) {
                this._lb.idx = (this._lb.idx + dir + this._lb.paths.length) % this._lb.paths.length;
                this.lbRender();
            },
            lbRender: function() {
                const path    = this._lb.paths[this._lb.idx];
                const img     = document.getElementById('bej-lb-img');
                img.src = path;
                img.alt = path;
                document.getElementById('bej-lb-path').textContent    = path;
                document.getElementById('bej-lb-counter').textContent = `${this._lb.idx + 1} / ${this._lb.paths.length}`;
                const single = this._lb.paths.length <= 1;
                document.getElementById('bej-lb-prev').classList.toggle('hidden', single);
                document.getElementById('bej-lb-next').classList.toggle('hidden', single);
            },

            esc: function(s) {
                return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            },

            escapeJsString: function(s) {
                return String(s ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
            }
        };

        document.addEventListener('keydown', (e) => {
            const lb = document.getElementById('bej-lightbox');
            if (!lb.classList.contains('on')) return;
            if (e.key === 'ArrowLeft')  { e.preventDefault(); app.lbNav(-1); }
            if (e.key === 'ArrowRight') { e.preventDefault(); app.lbNav(1); }
            if (e.key === 'Escape')     { e.preventDefault(); app.lbClose(); }
        });

        document.getElementById('bej-lightbox').addEventListener('click', (e) => {
            if (e.target === document.getElementById('bej-lightbox')) app.lbClose();
        });

        app.init();
    </script>
</body>
</html>
