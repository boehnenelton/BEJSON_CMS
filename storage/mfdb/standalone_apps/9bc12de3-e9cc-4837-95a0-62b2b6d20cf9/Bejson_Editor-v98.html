  FILE:         bejson-editor.html

  RELATION_ID:  f3a9c1e7-5b2d-4c8a-9e6f-1d7a4b2c8e93

  EMAIL:        boehnenelton2024@gmail.com
  GITHUB:       github.com/boehnenelton
  SITE:         https://boehnenelton2024.pages.dev
  DESCRIPTION:  Standalone browser-based editor for BEJSON 104, 104a, and 104db
                files. No server required — open directly in any modern browser.
                Supports full CRUD, sort/pin, field management, header management,
                AES-256-GCM encryption, 104 export/import, cell expand editor,
                and embedded strict BEJSON specification validation.
  CHANGELOG v98:
    - UNIVERSAL FILE PICKER FALLBACK: Implemented seamless dual-engine file loading
      and saving. When window.showOpenFilePicker or window.showSaveFilePicker is
      unavailable, restricted by browser security policies, running under file://
      protocol, or on Android / Linux / mobile / Firefox / Safari browsers, the
      editor automatically falls back to standard DOM <input type="file"> and
      Blob-download stream pipelines without throwing errors.
    - FULL CRUD RESILIENCE: Protected Open File, Import 104, Decrypt File, and
      Save As against File System Access API failures with automatic fallback.
  CHANGELOG v97:
    - BUNDLED COMPILED VALIDATOR & CORE: Embedded full compiled BEJSON validator
      engine (validateDocument, validate104, validate104a, validate104db,
      BEJSON_VALIDATION_CODES, BEJSON_CORE_CODES, field map caching) directly
      into the standalone editor.
    - RTP LEAKAGE FIX: Completely eliminated Record_Type_Parent (RTP) field and
      property injection on BEJSON 104 and 104a single-entity files. RTP is now
      strictly isolated to BEJSON 104db relational databases.
    - AUTO-INTEGRITY HEALING: ensureIntegrity() strips legacy/accidental RTP fields
      from 104/104a files and strictly enforces 104db discriminator column rules.
    - CUSTOM HEADER STRICT ENFORCEMENT:
        * 104a: Permits custom top-level metadata headers with PascalCase validation.
        * 104: Strictly forbids custom headers (only Parent_Hierarchy allowed).
        * 104db: Strictly forbids all custom headers.
    - 104a TYPE ENFORCEMENT: Enforces primitive-only types (string, integer, number,
      boolean) for 104a fields; disallows array and object types in 104a mode.
    - LIVE VALIDATION ENGINE: Integrated real-time validation across File Open,
      File Creation, Field Management, Header Management, and File Save.
    - SCHEMA VIEW DIAGNOSTICS: Added live validation status banner and error code
      diagnostics in Schema View.
==============================================================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEJSON Editor v98</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --input-bg: #252525;
            --input-bg-alt: #2E2E2E;
            --text-color: #FFFFFF;
            --red: #DC2626;
            --red-hover: #B91C1C;
            --dark-gray: #2B2B2B;
            --border-color: #333333;
            --selected: #7F1D1D;
            --btn-height: 40px;
            --green: #16A34A;
            --green-bg: #14532D;
            --amber: #D97706;
        }

        *, *::before, *::after { box-sizing: border-box; font-family: Arial, sans-serif; }
        body, button, label, th, td { user-select: none; }

        body { margin: 0; background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        #top-bar {
            background-color: #1A1A1A;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0; display: flex; flex-wrap: wrap;
            align-items: center; padding: 5px 12px; gap: 6px; min-height: 50px;
        }
        #top-bar-left  { display: flex; align-items: center; gap: 6px; flex: 1 1 auto; min-width: 160px; }
        #top-bar-right { display: flex; gap: 6px; align-items: center; flex: 1 1 auto; justify-content: flex-end; flex-wrap: wrap; }
        @media (max-width: 600px) {
            #top-bar { flex-direction: column; align-items: stretch; padding: 5px 8px; }
            #top-bar-left  { justify-content: flex-start; margin-bottom: 3px; }
            #top-bar-right { justify-content: space-between; width: 100%; }
        }
        #app-title { font-size: 17px; font-weight: bold; color: var(--red); white-space: nowrap; }

        .dirty-dot { color: var(--red); font-size: 16px; line-height: 1; margin-left: 2px; display: none; }
        .dirty-dot.visible { display: inline; }

        #main-frame { flex-grow: 1; padding: 10px 12px; overflow: hidden; position: relative; }

        .btn {
            background-color: var(--red); color: white; border: none;
            height: var(--btn-height); font-size: 14px; cursor: pointer;
            padding: 0 14px; display: inline-flex; align-items: center;
            justify-content: center; transition: background 0.2s; font-weight: bold; flex-shrink: 0;
        }
        .btn:hover { background-color: var(--red-hover); }
        .btn:disabled { background-color: var(--dark-gray); color: #888; cursor: not-allowed; }
        .btn-gray { background-color: var(--dark-gray); }
        .btn-gray:hover { background-color: #444; }

        input[type="text"], select {
            background-color: var(--input-bg); border: 1px solid var(--border-color);
            color: white; height: 36px; padding: 0 8px; font-size: 14px; width: 100%; outline: none;
        }
        input:focus { border-color: var(--red); }

        .center-panel {
            width: 100%; max-width: 400px; margin: 16px auto;
            background-color: var(--card-bg); padding: 18px;
            border: 1px solid var(--border-color); text-align: center;
        }
        .center-panel h2 { margin-top: 0; color: var(--text-color); margin-bottom: 12px; font-size: 17px; }
        .center-panel .btn, .center-panel select { margin-bottom: 6px; width: 100%; }

        .record-type-card {
            display: flex; align-items: center; justify-content: space-between;
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            padding: 8px 12px; margin-bottom: 4px; flex-wrap: wrap; gap: 6px;
        }
        .rt-actions { display: flex; gap: 6px; align-items: center; flex-grow: 1; justify-content: flex-end; }
        .rt-actions select { max-width: 180px; }

        .table-wrapper { width: 100%; height: 100%; overflow: auto; background-color: var(--bg-color); }
        table { border-collapse: collapse; width: max-content; }
        th, td { border: 1px solid var(--border-color); padding: 0; min-width: 150px; height: 40px; }
        th { position: sticky; top: 0; z-index: 10; background-color: var(--card-bg); }

        .row-num { width: 40px; min-width: 40px; text-align: center; color: #555; font-size: 11px; background-color: var(--bg-color); position: sticky; left: 50px; z-index: 4; border-right: 1px solid #2a2a2a !important; }
        th.row-num { z-index: 11; background-color: var(--card-bg); color: #444; font-size: 11px; }

        .header-btn { width: 100%; height: 100%; background-color: var(--red); border: none; color: white; font-weight: bold; cursor: pointer; transition: background 0.15s; }
        .header-btn:hover { background-color: var(--red-hover); }
        .header-btn.selected { background-color: var(--selected); }

        .pinned-col { background-color: #2D1A1A !important; border-left: 2px solid var(--red) !important; }
        .header-btn.pinned { background-color: var(--selected); border-bottom: 3px solid #ff4d4d; }

        .cell-input {
            width: 100%; height: 100%; border: none;
            background-color: transparent; color: white;
            padding: 0 10px; font-size: 14px; cursor: pointer; user-select: text;
        }
        .cell-input:focus { background-color: #1a2a3a; outline: 2px solid var(--red); outline-offset: -2px; cursor: text; }

        .row-even { background-color: var(--input-bg); }
        .row-odd  { background-color: var(--input-bg-alt); }
        .row-check { width: 50px; min-width: 50px; text-align: center; background-color: var(--bg-color); position: sticky; left: 0; z-index: 5; }
        th.row-check { z-index: 11; }

        .record-count-badge { color: #aaa; font-size: 13px; white-space: nowrap; margin-left: 4px; }
        .version-badge { background: #333; color: #fff; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 3px; }

        .val-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 3px; }
        .val-badge.valid { background: var(--green-bg); color: #86EFAC; border: 1px solid var(--green); }
        .val-badge.invalid { background: #7F1D1D; color: #FCA5A5; border: 1px solid var(--red); }

        #cell-expand-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3000; display: none;
        }
        #cell-expand-box {
            position: absolute;
            background-color: #1a1a2e;
            border: 2px solid var(--red);
            box-shadow: 0 8px 24px rgba(0,0,0,0.75);
            display: flex; flex-direction: column;
            min-width: 280px; max-width: 500px; z-index: 3001;
        }
        #cell-expand-header {
            background-color: var(--red); color: white;
            font-size: 12px; font-weight: bold; padding: 6px 10px;
            display: flex; justify-content: space-between; align-items: center; user-select: none;
            flex-shrink: 0;
        }
        #cell-expand-toolbar {
            display: flex; gap: 6px; padding: 6px 8px; background-color: #111;
            overflow-x: auto; white-space: nowrap; flex-shrink: 0;
            -webkit-overflow-scrolling: touch;
        }
        #cell-expand-toolbar button {
            flex: 0 0 auto; height: 32px; padding: 0 12px; border: 1px solid #444;
            background-color: var(--dark-gray); color: #ccc; font-size: 12px;
            cursor: pointer; white-space: nowrap;
        }
        #cell-expand-toolbar button:hover  { background-color: #444; color: #fff; }
        #cell-expand-toolbar button:active { background-color: var(--red); color: #fff; }
        #cell-expand-textarea {
            background-color: #1a1a2e; color: white; border: none;
            padding: 10px; font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: none; height: 120px; outline: none; width: 100%; user-select: text;
        }
        #cell-expand-footer { display: flex; gap: 8px; padding: 8px; background-color: #111; flex-shrink: 0; }
        #cell-expand-footer button { flex: 1; height: 34px; border: none; cursor: pointer; font-size: 13px; font-weight: bold; }
        #cell-expand-save   { background-color: var(--red); color: white; }
        #cell-expand-save:hover { background-color: var(--red-hover); }
        #cell-expand-cancel { background-color: var(--dark-gray); color: #ccc; }
        #cell-expand-cancel:hover { background-color: #444; }

        #cell-expand-box.ce-fullscreen {
            position: fixed; left: 0 !important; top: 0 !important;
            width: 100% !important; height: 100%; max-width: none;
            border: none; border-top: 3px solid var(--red);
        }
        #cell-expand-box.ce-fullscreen #cell-expand-textarea { flex: 1 1 auto; height: auto; font-size: 16px; }

        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            padding: 20px; display: flex; flex-direction: column; width: 92%;
            max-width: 520px; max-height: 85dvh; overflow: hidden;
        }
        .modal-sm    { max-width: 380px; }
        .modal-lg    { max-width: 680px; }
        .modal-body  { flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0; }
        .modal-footer { flex-shrink: 0; display: flex; gap: 8px; margin-top: 12px; }
        .modal-content h2 { margin: 0 0 10px 0; font-size: 16px; flex-shrink: 0; }
        .modal-footer .btn { flex: 1; }

        .meta-table { width: 100%; border-collapse: collapse; }
        .meta-table td, .meta-table th { padding: 8px; border-bottom: 1px solid #333; }
        .meta-table input { height: 35px; border: 1px solid #444; }

        #context-menu {
            position: absolute; background-color: var(--card-bg);
            border: 1px solid var(--red); display: none; flex-direction: column;
            width: 180px; z-index: 2000; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .ctx-item { padding: 12px 15px; color: white; cursor: pointer; font-size: 14px; user-select: none; }
        .ctx-item:hover { background-color: var(--red); }
        .ctx-sep { height: 1px; background-color: var(--border-color); margin: 2px 0; }

        .text-gray { color: #888; font-size: 14px; }
        .actions-container { display: flex; gap: 10px; align-items: center; width: 100%; }
        .info-link { color: var(--red); text-decoration: none; font-weight: bold; }
        .info-link:hover { text-decoration: underline; }

        #hamburger-btn {
            background: none; border: none; cursor: pointer;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 5px; width: 40px; height: 40px;
            padding: 0; flex-shrink: 0;
        }
        .hbar { width: 18px; height: 2px; background: #aaa; border-radius: 2px; transition: all .2s; }

        #sidebar {
            position: fixed; top: 0; left: 0; height: 100%;
            width: 240px; background: #111; border-right: 1px solid var(--border-color);
            z-index: 2000; display: flex; flex-direction: column;
            transform: translateX(-100%); transition: transform .22s ease;
            box-shadow: 4px 0 20px rgba(0,0,0,.5);
        }
        #sidebar.open { transform: translateX(0); }
        #sidebar-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,.5);
            z-index: 1999; display: none;
        }
        #sidebar-backdrop.on { display: block; }
        .sb-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; border-bottom: 1px solid var(--border-color);
            background: #1A1A1A; flex-shrink: 0;
        }
        .sb-title { font-size: 13px; font-weight: bold; color: var(--red); }
        .sb-close { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; line-height: 1; padding: 0 4px; }
        .sb-close:hover { color: #fff; }
        .sb-filename {
            font-size: 11px; color: #aaa; padding: 10px 12px 6px;
            word-break: break-all; font-family: monospace;
            border-bottom: 1px solid #222; flex-shrink: 0;
        }
        .sb-filename span { color: #fff; }
        .sb-nav { display: flex; flex-direction: column; padding: 8px 0; flex: 1; }
        .sb-nav-btn {
            background: none; border: none; color: #ccc; font-size: 13px;
            text-align: left; padding: 12px 16px; cursor: pointer; transition: background .15s;
        }
        .sb-nav-btn:hover { background: #1e1e1e; color: #fff; }
        .sb-nav-btn.red { color: var(--red); }
        .sb-nav-btn.red:hover { background: #1e1e1e; }

        .sf-link {
            display: block; width: 100%; height: 100%;
            padding: 0 10px; font-size: 14px; line-height: 40px;
            color: #f59e0b; text-decoration: underline dotted;
            cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            background: transparent; border: none; text-align: left;
        }
        .sf-link:hover { color: #fbbf24; }

        #bej-lightbox {
            position: fixed; inset: 0; background: rgba(0,0,0,.92);
            z-index: 4000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }
        #bej-lightbox.on { display: flex; }
        #bej-lb-inner { position: relative; display: flex; align-items: center; justify-content: center; flex: 1; width: 100%; padding: 12px 56px; min-height: 0; }
        #bej-lb-img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
        .bej-lb-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 44px; height: 44px; background: rgba(255,255,255,.12);
            border: none; border-radius: 50%; color: #fff; font-size: 22px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background .15s;
        }
        .bej-lb-nav:hover { background: rgba(255,255,255,.28); }
        #bej-lb-prev { left: 6px; }
        #bej-lb-next { right: 6px; }
        .bej-lb-nav.hidden { visibility: hidden; pointer-events: none; }
        #bej-lb-footer { width: 100%; padding: 8px 16px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        #bej-lb-path { font-family: monospace; font-size: 11px; color: #aaa; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #bej-lb-counter { font-size: 11px; color: #888; flex-shrink: 0; }
        #bej-lb-close { background: none; border: none; color: #888; font-size: 22px; cursor: pointer; flex-shrink: 0; padding: 0 4px; }
        #bej-lb-close:hover { color: #fff; }
    </style>
</head>
<body>

    <div id="sidebar-backdrop" onclick="app.closeSidebar()"></div>

    <div id="sidebar">
        <div class="sb-header">
            <span class="sb-title">BEJSON Editor</span>
            <button class="sb-close" onclick="app.closeSidebar()">×</button>
        </div>
        <div class="sb-filename" id="sb-filename" style="display:none;">
            File: <span id="sb-filename-text"></span>
        </div>
        <div class="sb-nav" id="sb-nav"></div>
    </div>

    <div id="bej-lightbox">
        <div id="bej-lb-inner">
            <button class="bej-lb-nav hidden" id="bej-lb-prev" onclick="app.lbNav(-1)">&#8249;</button>
            <img id="bej-lb-img" src="" alt="" onerror="this.alt='Image not found'; this.style.border='1px solid #555'; this.style.padding='20px'; this.style.color='#888';">
            <button class="bej-lb-nav hidden" id="bej-lb-next" onclick="app.lbNav(1)">&#8250;</button>
        </div>
        <div id="bej-lb-footer">
            <button id="bej-lb-close" onclick="app.lbClose()">✕</button>
            <span id="bej-lb-path"></span>
            <span id="bej-lb-counter"></span>
        </div>
    </div>

    <div id="cell-expand-overlay">
        <div id="cell-expand-box">
            <div id="cell-expand-header">
                <span id="cell-expand-label">Field</span>
                <span style="opacity:0.7; font-weight:normal;">Enter=Save &nbsp; Esc=Cancel</span>
            </div>
            <div id="cell-expand-toolbar">
                <button type="button" onclick="app.ceSelectAll()">Select All</button>
                <button type="button" onclick="app.ceInvertSelect()">Invert Sel</button>
                <button type="button" onclick="app.ceCopy()">Copy</button>
                <button type="button" onclick="app.ceCut()">Cut</button>
                <button type="button" onclick="app.cePaste()">Paste</button>
            </div>
            <textarea id="cell-expand-textarea" spellcheck="false"></textarea>
            <div id="cell-expand-footer">
                <button id="cell-expand-save">Save</button>
                <button id="cell-expand-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <div id="context-menu"></div>
    <div id="modal-overlay"></div>

    <div id="top-bar">
        <div id="top-bar-left">
            <button id="hamburger-btn" onclick="app.openSidebar()" title="Menu">
                <span class="hbar"></span><span class="hbar"></span><span class="hbar"></span>
            </button>
            <div id="app-title">BEJSON Editor</div>
            <span class="dirty-dot" id="dirty-dot" title="Unsaved changes pending">●</span>
        </div>
        <div id="top-bar-right"></div>
    </div>

    <div id="main-frame"></div>

    <script>
        const APP_VERSION = "98";

        // =====================================================================
        // SECTION 1: COMPILED BEJSON SPECIFICATION & VALIDATION ENGINE
        // Sourced from bejson_core_compiled (JS/TS Core & Validator Families)
        // =====================================================================

        const BEJSON_VALIDATION_CODES = {
            INVALID_JSON: 1,
            MISSING_MANDATORY_KEY: 2,
            INVALID_FORMAT_VALUE: 3,
            INVALID_FORMAT_VERSION: 4,
            INVALID_RECORDS_TYPE: 5,
            INVALID_FIELDS: 6,
            INVALID_VALUES: 7,
            VALUE_TYPE_MISMATCH: 8,
            RECORD_LENGTH_MISMATCH: 9,
            RESERVED_KEY_COLLISION: 10,
            INVALID_RECORD_TYPE_PARENT: 11,
            NULL_VIOLATION: 12,
            FILE_NOT_FOUND: 13,
            PERMISSION_DENIED: 14,
            ATOMIC_WRITE_FAILED: 15,
            INVALID_FORMAT_CREATOR: 16,
            DUPLICATE_FIELD_NAME: 6,
            VERSION_CONSTRAINT: 4,
            FORBIDDEN_CUSTOM_KEY: 10,
            INVALID_CUSTOM_KEY: 10,
            MISSING_DISCRIMINATOR: 11,
            INVALID_VALUES_STRUCTURE: 7
        };

        const BEJSON_CORE_CODES = {
            INVALID_VERSION: 20,
            INVALID_OPERATION: 21,
            INDEX_OUT_OF_BOUNDS: 22,
            FIELD_NOT_FOUND: 23,
            TYPE_CONVERSION_FAILED: 24,
            BACKUP_FAILED: 25,
            WRITE_FAILED: 26,
            QUERY_FAILED: 27,
            ENCRYPTION_FAILED: 28,
            DECRYPTION_FAILED: 29,
            PARSE_ERROR: 17,
            SERIALIZATION_ERROR: 18,
            NULL_DOCUMENT: 19
        };

        class BEJSONValidationError extends Error {
            constructor(code, message) {
                super(message);
                this.name = "BEJSONValidationError";
                this.code = code;
            }
        }

        class BEJSONCoreError extends Error {
            constructor(code, message) {
                super(message);
                this.name = "BEJSONCoreError";
                this.code = code;
            }
        }

        const MANDATORY_KEYS = ["Format", "Format_Version", "Format_Creator", "Records_Type", "Fields", "Values"];
        const MANDATORY_HEADERS = new Set(MANDATORY_KEYS);
        const VALID_VERSIONS = ["104", "104a", "104db"];
        const VALID_FIELD_TYPES = ["string", "integer", "number", "boolean", "array", "object"];
        const PRIMITIVE_FIELD_TYPES = ["string", "integer", "number", "boolean"];
        const PASCAL_CASE_RE = /^[A-Z][A-Za-z0-9]*(_[A-Za-z0-9]+)*$/;

        function _makeResult() {
            return { valid: true, errors: [], warnings: [] };
        }

        function _err(r, code, message, field, recordIndex) {
            r.valid = false;
            const e = { code, message };
            if (field !== undefined) e.field = field;
            if (recordIndex !== undefined) e.recordIndex = recordIndex;
            r.errors.push(e);
        }

        function _warn(r, code, message, field, recordIndex) {
            const w = { code, message };
            if (field !== undefined) w.field = field;
            if (recordIndex !== undefined) w.recordIndex = recordIndex;
            r.warnings.push(w);
        }

        function _typeMatches(val, type) {
            if (val === null) return true;
            switch (type) {
                case "string":  return typeof val === "string";
                case "integer": return typeof val === "number" && Number.isInteger(val);
                case "number":  return typeof val === "number";
                case "boolean": return typeof val === "boolean";
                case "array":   return Array.isArray(val);
                case "object":  return typeof val === "object" && !Array.isArray(val) && val !== null;
                default:        return false;
            }
        }

        function validateDocument(doc) {
            const result = _makeResult();
            if (doc === null || doc === undefined || typeof doc !== "object" || Array.isArray(doc)) {
                _err(result, BEJSON_VALIDATION_CODES.INVALID_FORMAT_VALUE, "Document root must be a non-null object.");
                return result;
            }

            for (const key of MANDATORY_KEYS) {
                if (!(key in doc) || doc[key] === undefined) {
                    _err(result, BEJSON_VALIDATION_CODES.MISSING_MANDATORY_KEY, "Missing mandatory key: " + key, key);
                }
            }
            if (!result.valid) return result;

            if (doc.Format !== "BEJSON") {
                _err(result, BEJSON_VALIDATION_CODES.INVALID_FORMAT_VALUE, "Format must be \"BEJSON\", got \"" + doc.Format + "\".", "Format");
            }
            if (!VALID_VERSIONS.includes(doc.Format_Version)) {
                _err(result, BEJSON_VALIDATION_CODES.INVALID_FORMAT_VERSION, "Format_Version must be one of " + JSON.stringify(VALID_VERSIONS) + ", got \"" + doc.Format_Version + "\".", "Format_Version");
            }
            if (doc.Format_Creator !== "Elton Boehnen") {
                _err(result, BEJSON_VALIDATION_CODES.INVALID_FORMAT_CREATOR, "Format_Creator must be \"Elton Boehnen\", got \"" + doc.Format_Creator + "\".", "Format_Creator");
            }
            if (!Array.isArray(doc.Records_Type) || doc.Records_Type.length === 0) {
                _err(result, BEJSON_VALIDATION_CODES.INVALID_RECORDS_TYPE, "Records_Type must be a non-empty array.", "Records_Type");
            } else {
                for (const rt of doc.Records_Type) {
                    if (typeof rt !== "string" || rt.trim() === "") {
                        _err(result, BEJSON_VALIDATION_CODES.INVALID_RECORDS_TYPE, "All Records_Type entries must be non-empty strings.", "Records_Type");
                        break;
                    }
                }
            }
            if (!result.valid) return result;

            if (!Array.isArray(doc.Fields) || doc.Fields.length === 0) {
                _err(result, BEJSON_VALIDATION_CODES.INVALID_FIELDS, "Fields must be a non-empty array.", "Fields");
                return result;
            }
            const seenFieldNames = new Set();
            for (let i = 0; i < doc.Fields.length; i++) {
                const f = doc.Fields[i];
                if (!f || typeof f !== "object") {
                    _err(result, BEJSON_VALIDATION_CODES.INVALID_FIELDS, "Fields[" + i + "] must be an object.", "Fields");
                    continue;
                }
                if (typeof f.name !== "string" || f.name.trim() === "") {
                    _err(result, BEJSON_VALIDATION_CODES.INVALID_FIELDS, "Fields[" + i + "].name must be a non-empty string.", "Fields");
                }
                if (!VALID_FIELD_TYPES.includes(f.type)) {
                    _err(result, BEJSON_VALIDATION_CODES.INVALID_FIELDS, "Fields[" + i + "].type is invalid: \"" + f.type + "\".", "Fields");
                }
                if (seenFieldNames.has(f.name)) {
                    _err(result, BEJSON_VALIDATION_CODES.DUPLICATE_FIELD_NAME, "Duplicate field name: \"" + f.name + "\".", f.name);
                } else {
                    seenFieldNames.add(f.name);
                }
            }

            if (!Array.isArray(doc.Values)) {
                _err(result, BEJSON_VALIDATION_CODES.INVALID_VALUES_STRUCTURE, "Values must be an array.", "Values");
                return result;
            }
            const fieldCount = doc.Fields.length;
            for (let i = 0; i < doc.Values.length; i++) {
                const row = doc.Values[i];
                if (!Array.isArray(row)) {
                    _err(result, BEJSON_VALIDATION_CODES.INVALID_VALUES_STRUCTURE, "Values[" + i + "] must be an array.", undefined, i);
                    continue;
                }
                if (row.length !== fieldCount) {
                    _err(result, BEJSON_VALIDATION_CODES.RECORD_LENGTH_MISMATCH, "Values[" + i + "] has " + row.length + " elements but Fields has " + fieldCount + ".", undefined, i);
                    continue;
                }
                for (let fi = 0; fi < fieldCount; fi++) {
                    const field = doc.Fields[fi];
                    const val = row[fi];
                    if (val === null) continue;
                    if (!_typeMatches(val, field.type)) {
                        _err(result, BEJSON_VALIDATION_CODES.VALUE_TYPE_MISMATCH, "Values[" + i + "][" + fi + "] (" + field.name + "): expected " + field.type + ", got " + typeof val + ".", field.name, i);
                    }
                }
            }

            const ver = doc.Format_Version;
            if (ver === "104") {
                if (doc.Records_Type.length !== 1) {
                    _err(result, BEJSON_VALIDATION_CODES.VERSION_CONSTRAINT, "BEJSON 104 requires exactly one Records_Type entry.", "Records_Type");
                }
                for (const k of Object.keys(doc)) {
                    if (!MANDATORY_HEADERS.has(k) && k !== "Parent_Hierarchy") {
                        _err(result, BEJSON_VALIDATION_CODES.FORBIDDEN_CUSTOM_KEY, "BEJSON 104 forbids custom top-level header: \"" + k + "\".", k);
                    }
                }
                if ("Parent_Hierarchy" in doc && typeof doc.Parent_Hierarchy !== "string") {
                    _err(result, BEJSON_VALIDATION_CODES.VERSION_CONSTRAINT, "Parent_Hierarchy must be a string.", "Parent_Hierarchy");
                }
                if (doc.Fields.some(f => f.name === "Record_Type_Parent")) {
                    _err(result, BEJSON_VALIDATION_CODES.VERSION_CONSTRAINT, "BEJSON 104 single-entity format must not contain 'Record_Type_Parent' field.", "Record_Type_Parent");
                }
            } else if (ver === "104a") {
                if (doc.Records_Type.length !== 1) {
                    _err(result, BEJSON_VALIDATION_CODES.VERSION_CONSTRAINT, "BEJSON 104a requires exactly one Records_Type entry.", "Records_Type");
                }
                for (let i = 0; i < doc.Fields.length; i++) {
                    const f = doc.Fields[i];
                    if (!PRIMITIVE_FIELD_TYPES.includes(f.type)) {
                        _err(result, BEJSON_VALIDATION_CODES.VERSION_CONSTRAINT, "BEJSON 104a: Fields[" + i + "].type \"" + f.type + "\" is not primitive. Array and object are forbidden in 104a.", f.name);
                    }
                }
                for (const k of Object.keys(doc)) {
                    if (MANDATORY_HEADERS.has(k)) continue;
                    if (k === "Parent_Hierarchy") continue;
                    if (!PASCAL_CASE_RE.test(k)) {
                        _err(result, BEJSON_VALIDATION_CODES.INVALID_CUSTOM_KEY, "BEJSON 104a: custom header \"" + k + "\" must be PascalCase.", k);
                    }
                }
                if (doc.Fields.some(f => f.name === "Record_Type_Parent")) {
                    _err(result, BEJSON_VALIDATION_CODES.VERSION_CONSTRAINT, "BEJSON 104a single-entity format must not contain 'Record_Type_Parent' field.", "Record_Type_Parent");
                }
            } else if (ver === "104db") {
                if (doc.Records_Type.length < 2) {
                    _err(result, BEJSON_VALIDATION_CODES.VERSION_CONSTRAINT, "BEJSON 104db requires at least two Records_Type entries.", "Records_Type");
                }
                for (const k of Object.keys(doc)) {
                    if (!MANDATORY_HEADERS.has(k)) {
                        _err(result, BEJSON_VALIDATION_CODES.FORBIDDEN_CUSTOM_KEY, "BEJSON 104db forbids custom top-level header: \"" + k + "\".", k);
                    }
                }
                if (doc.Fields.length === 0 || doc.Fields[0].name !== "Record_Type_Parent") {
                    _err(result, BEJSON_VALIDATION_CODES.MISSING_DISCRIMINATOR, "BEJSON 104db: first field must be named \"Record_Type_Parent\".", "Fields");
                } else if (doc.Fields[0].type !== "string") {
                    _err(result, BEJSON_VALIDATION_CODES.MISSING_DISCRIMINATOR, "BEJSON 104db: Record_Type_Parent field type must be \"string\".", "Record_Type_Parent");
                }
                const validEntities = new Set(doc.Records_Type);
                for (let i = 1; i < doc.Fields.length; i++) {
                    const f = doc.Fields[i];
                    if (!f.Record_Type_Parent) {
                        _err(result, BEJSON_VALIDATION_CODES.MISSING_DISCRIMINATOR, "BEJSON 104db: Fields[" + i + "] (\"" + f.name + "\") is missing Record_Type_Parent assignment.", f.name);
                    } else if (!validEntities.has(f.Record_Type_Parent)) {
                        _err(result, BEJSON_VALIDATION_CODES.VERSION_CONSTRAINT, "BEJSON 104db: Fields[" + i + "].Record_Type_Parent \"" + f.Record_Type_Parent + "\" is not in Records_Type.", f.name);
                    }
                }
                for (let i = 0; i < doc.Values.length; i++) {
                    const row = doc.Values[i];
                    if (!Array.isArray(row) || row.length === 0) continue;
                    const discriminator = row[0];
                    if (typeof discriminator !== "string" || !validEntities.has(discriminator)) {
                        _err(result, BEJSON_VALIDATION_CODES.VERSION_CONSTRAINT, "Values[" + i + "][0] discriminator \"" + discriminator + "\" is not in Records_Type.", "Record_Type_Parent", i);
                    }
                }
            }

            return result;
        }

        function validate104(doc) {
            const result = validateDocument(doc);
            if (result.valid && doc.Format_Version !== "104") {
                _err(result, BEJSON_VALIDATION_CODES.INVALID_FORMAT_VERSION, "Expected Format_Version \"104\", got \"" + doc.Format_Version + "\".");
            }
            return result;
        }

        function validate104a(doc) {
            const result = validateDocument(doc);
            if (result.valid && doc.Format_Version !== "104a") {
                _err(result, BEJSON_VALIDATION_CODES.INVALID_FORMAT_VERSION, "Expected Format_Version \"104a\", got \"" + doc.Format_Version + "\".");
            }
            return result;
        }

        function validate104db(doc) {
            const result = validateDocument(doc);
            if (result.valid && doc.Format_Version !== "104db") {
                _err(result, BEJSON_VALIDATION_CODES.INVALID_FORMAT_VERSION, "Expected Format_Version \"104db\", got \"" + doc.Format_Version + "\".");
            }
            return result;
        }

        const _FIELD_MAP_CACHE = new Map();
        function bejson_core_get_field_map(doc) {
            if (!doc || !doc.Fields) return {};
            const fieldNames = doc.Fields.map(f => f.name);
            const cacheKey = (doc.Format_Version || '104') + ':' + fieldNames.join(',');
            const cached = _FIELD_MAP_CACHE.get(cacheKey);
            if (cached) return cached;
            const fieldMap = {};
            doc.Fields.forEach((f, i) => { fieldMap[f.name] = i; });
            _FIELD_MAP_CACHE.set(cacheKey, fieldMap);
            return fieldMap;
        }

        function bejson_core_get_field_index(doc, fieldName) {
            const fieldMap = bejson_core_get_field_map(doc);
            const idx = fieldMap[fieldName];
            return (idx !== undefined) ? idx : -1;
        }

            cellExpandOpen: function(inputEl, rowIdx, colIdx, fieldName) {
                appState.expandCell = { rowIdx, colIdx, inputEl };

                const box     = document.getElementById('cell-expand-box');

                const isMobile = window.innerWidth <= 700 || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
                if (isMobile) {
                    box.classList.add('ce-fullscreen');
                    box.style.left = ''; box.style.top = ''; box.style.width = '';
                } else {
                    box.classList.remove('ce-fullscreen');
                    const rect = inputEl.getBoundingClientRect();
                    const bw = 320, bh = 190;
                    let x = rect.left, y = rect.bottom + 4;
                    if (x + bw > window.innerWidth  - 10) x = window.innerWidth  - bw - 10;
                    if (y + bh > window.innerHeight - 10) y = rect.top - bh - 4;
                    if (x < 10) x = 10;
                    if (y < 10) y = 10;

                    box.style.left  = x + 'px';
                    box.style.top   = y + 'px';
                    box.style.width = Math.max(bw, rect.width) + 'px';
                }

                ta.focus();
                ta.select();
            },

            ceSelectAll: function() {
                const ta = document.getElementById('cell-expand-textarea');
                ta.focus();
                ta.setSelectionRange(0, ta.value.length);
            },
            ceInvertSelect: function() {
                const ta = document.getElementById('cell-expand-textarea');
                ta.focus();
                const isAllSelected = ta.selectionStart === 0 && ta.selectionEnd === ta.value.length && ta.value.length > 0;
                if (isAllSelected) ta.setSelectionRange(0, 0);
                else               ta.setSelectionRange(0, ta.value.length);
            },
            ceCopy: async function() {
                const ta = document.getElementById('cell-expand-textarea');
                const text = ta.selectionStart !== ta.selectionEnd
                    ? ta.value.substring(ta.selectionStart, ta.selectionEnd) : ta.value;
                try { await navigator.clipboard.writeText(text); }
                catch(e) { ta.focus(); ta.select(); document.execCommand('copy'); }
            },
            ceCut: async function() {
                const ta = document.getElementById('cell-expand-textarea');
                const hasSel = ta.selectionStart !== ta.selectionEnd;
                const start = hasSel ? ta.selectionStart : 0;
                const end   = hasSel ? ta.selectionEnd   : ta.value.length;
                const text  = ta.value.substring(start, end);
                try { await navigator.clipboard.writeText(text); } catch(e) {}
                ta.value = ta.value.substring(0, start) + ta.value.substring(end);
                ta.focus(); ta.setSelectionRange(start, start);
            },
            cePaste: async function() {
                const ta = document.getElementById('cell-expand-textarea');
                try {
                    const clip = await navigator.clipboard.readText();
                    const start = ta.selectionStart, end = ta.selectionEnd;
                    ta.value = ta.value.substring(0, start) + clip + ta.value.substring(end);
                    ta.focus(); ta.setSelectionRange(start + clip.length, start + clip.length);
                } catch(e) { alert("Clipboard blocked — use device paste (long-press → Paste)."); }
            },

            cellTouchStart: function(e, inputEl, rowIdx, colIdx, fieldName) {
                this._ceTouchFired = false;
                this._ceTouchX = e.touches[0].clientX;
                this._ceTouchY = e.touches[0].clientY;
                clearTimeout(this._ceTouchTimer);
                this._ceTouchTimer = setTimeout(() => {
                    this._ceTouchFired = true;
                    if (navigator.vibrate) navigator.vibrate(25);
                    this.cellExpandOpen(inputEl, rowIdx, colIdx, fieldName);
                }, 500);
            },
            cellTouchMove: function(e) {
                if (!this._ceTouchTimer) return;
                const dx = Math.abs(e.touches[0].clientX - this._ceTouchX);
                const dy = Math.abs(e.touches[0].clientY - this._ceTouchY);
                if (dx > 10 || dy > 10) { clearTimeout(this._ceTouchTimer); this._ceTouchTimer = null; }
            },
            cellTouchEnd: function(e) {
                clearTimeout(this._ceTouchTimer);
                this._ceTouchTimer = null;
                if (this._ceTouchFired) { e.preventDefault(); }
            },

                d.Fields.forEach((f, i) => {
                    rows += `<tr>
                        <td style="padding:6px 10px; color:#888; text-align:right;">${i}</td>
                        <td style="padding:6px 10px; font-weight:bold;">${this.esc(f.name)}</td>
                        <td style="padding:6px 10px; color:#aaa;">${this.esc(f.type)}</td>
                        ${ver === '104db' ? `<td style="padding:6px 10px; color:#888; font-size:12px;">${f.Record_Type_Parent ? this.esc(f.Record_Type_Parent) : '—'}</td>` : ''}
                    </tr>`;
                });

                const customKeys = Object.keys(d).filter(k => !MANDATORY_HEADERS.has(k));
                let headersHtml = '';
                if (customKeys.length > 0) {
                    headersHtml = `<div style="margin-top:14px; padding-top:10px; border-top:1px solid #333;">
                        <div style="font-size:12px; color:#888; margin-bottom:6px;">Custom Top-Level Headers (${ver})</div>`;
                    customKeys.forEach(k => {
                        const val = typeof d[k] === 'object' ? JSON.stringify(d[k]) : String(d[k] != null ? d[k] : '');
                        headersHtml += `<div style="display:flex; gap:8px; font-size:13px; margin-bottom:4px;">
                            <span style="color:var(--red); min-width:120px;">${this.esc(k)}</span>
                            <span style="color:#ccc;">${this.esc(val)}</span></div>`;
                    });
                    headersHtml += '</div>';
                }

                let valStatusHtml = '';
                if (valRes.valid) {
                    valStatusHtml = `<span class="val-badge valid">✓ Valid BEJSON ${this.esc(ver)}</span>`;
                } else {
                    valStatusHtml = `<span class="val-badge invalid">✕ ${valRes.errors.length} Validation Error(s)</span>`;
                }

                const visualHtml = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:6px;">
                        <div style="font-size:12px; color:#888;">
                            Format: <strong style="color:#ccc;">${this.esc(ver)}</strong> &nbsp;|&nbsp; 
                            Record Types: <strong style="color:#ccc;">${this.esc(d.Records_Type.join(', '))}</strong> &nbsp;|&nbsp; 
                            Fields: <strong style="color:#ccc;">${d.Fields.length}</strong> &nbsp;|&nbsp; 
                            Records: <strong style="color:#ccc;">${d.Values.length}</strong>
                        </div>
                        <div>${valStatusHtml}</div>
                    </div>
                    ${!valRes.valid ? `
                        <div style="background:#2A1212; border:1px solid var(--red); padding:8px 12px; margin-bottom:10px; font-size:12px; color:#FCA5A5;">
                            <strong>Validation Issues:</strong>
                            <ul style="margin:4px 0 0 0; padding-left:18px;">
                                ${valRes.errors.map(e => `<li>[Code ${e.code}] ${this.esc(e.message)}</li>`).join('')}
                            </ul>
                        </div>
                    ` : ''}
                    <table style="width:100%; border-collapse:collapse; font-size:13px;">
                        <thead><tr style="border-bottom:1px solid #444;">
                            <th style="padding:6px 10px; text-align:right; color:#555; width:36px;">#</th>
                            <th style="padding:6px 10px; text-align:left; color:#888;">name</th>
                            <th style="padding:6px 10px; text-align:left; color:#888;">type</th>
                            ${ver === '104db' ? '<th style="padding:6px 10px; text-align:left; color:#888;">Record_Type_Parent</th>' : ''}
                        </tr></thead>
                        <tbody>${rows}</tbody>
                    </table>${headersHtml}`;

                const schemaObj = {
                    Format: d.Format,
                    Format_Version: d.Format_Version,
                    Format_Creator: d.Format_Creator,
                    Records_Type: d.Records_Type,
                    Fields: d.Fields
                };
                customKeys.forEach(k => { schemaObj[k] = d[k]; });
                const rawJson = JSON.stringify(schemaObj, null, 2);
                this._schemaRawJson = rawJson;

                const html = `
                    <h2 style="margin-bottom:8px;">Schema Details</h2>
                    <div style="display:flex; gap:0; border-bottom:1px solid #444; margin-bottom:10px; flex-shrink:0;">
                        <button id="stab-visual" onclick="app._schemaTab('visual')" style="flex:1; height:34px; background:var(--red); color:#fff; border:none; cursor:pointer; font-size:13px; font-weight:bold;">Visual</button>
                        <button id="stab-raw" onclick="app._schemaTab('raw')" style="flex:1; height:34px; background:var(--dark-gray); color:#888; border:none; cursor:pointer; font-size:13px;">Raw JSON</button>
                    </div>
                    <div class="modal-body">
                        <div id="schema-pane-visual">${visualHtml}</div>
                        <div id="schema-pane-raw" style="display:none; flex-direction:column; gap:8px;">
                            <button onclick="app._schemaCopyRaw()" style="align-self:flex-start; height:32px; padding:0 14px; background:var(--dark-gray); color:#ccc; border:none; cursor:pointer; font-size:12px;">📋 Copy JSON</button>
                            <textarea readonly id="schema-raw-text" style="flex:1; min-height:260px; background:#111; color:#ccc; border:1px solid #333; padding:10px; font-family:monospace; font-size:12px; resize:none; user-select:text;">${this.esc(rawJson)}</textarea>
                        </div>
                    </div>
                    <div class="modal-footer"><button class="btn" onclick="app.closeModal()">Close</button></div>`;

                this.showModal(html, "modal-lg");
            },

            _schemaTab: function(tab) {
                const vis = document.getElementById('schema-pane-visual');
                const raw = document.getElementById('schema-pane-raw');
                const bv  = document.getElementById('stab-visual');
                const br  = document.getElementById('stab-raw');
                if (!vis || !raw) return;
                if (tab === 'visual') {
                    vis.style.display = ''; raw.style.display = 'none';
                    bv.style.background = 'var(--red)';       bv.style.color = '#fff';
                    br.style.background = 'var(--dark-gray)'; br.style.color = '#888';
                } else {
                    vis.style.display = 'none'; raw.style.display = 'flex';
                    br.style.background = 'var(--red)';       br.style.color = '#fff';
                    bv.style.background = 'var(--dark-gray)'; bv.style.color = '#888';
                }
            },

            _schemaCopyRaw: function() {
                const raw = this._schemaRawJson || '';
                navigator.clipboard.writeText(raw).then(() => {
                    const btn = document.querySelector('#schema-pane-raw button');
                    if (btn) { const orig = btn.textContent; btn.textContent = '✓ Copied!'; setTimeout(() => btn.textContent = orig, 1500); }
                }).catch(() => {
                    const ta = document.getElementById('schema-raw-text');
                    if (ta) { ta.select(); document.execCommand('copy'); }
                });
            },

            manageHeadersAction: function() {
                const ver = appState.dbData.Format_Version || "";
                const is104a = (ver === "104a");
                const is104  = (ver === "104");
                const is104db = (ver === "104db");
                const d = appState.dbData;
                const customKeys = Object.keys(d).filter(k => !MANDATORY_HEADERS.has(k));

                let note = '';
                if (is104a) {
                    note = 'BEJSON 104a allows custom top-level metadata headers (must be PascalCase).';
                } else if (is104) {
                    note = 'BEJSON 104 forbids custom headers. Only "Parent_Hierarchy" is permitted for entity files.';
                } else if (is104db) {
                    note = 'BEJSON 104db strictly forbids all custom headers.';
                }

                let html = `<h2>${is104a ? 'Manage File Headers (104a)' : 'View File Headers'}</h2>`;
                if (note) html += `<div style="color:#aaa; font-size:13px; margin-bottom:10px;">${note}</div>`;
                html += `<div class="modal-body"><table class="meta-table" id="header-table">
                    <tr><th>Key</th><th>Value</th><th style="width:60px;">Action</th></tr>`;

                ['Format', 'Format_Version', 'Format_Creator'].forEach(k => {
                    html += `<tr>
                        <td><input type="text" value="${this.esc(k)}" disabled style="color:#888;"></td>
                        <td><input type="text" value="${this.esc(String(d[k] ?? ''))}" disabled style="color:#888;"></td>
                        <td style="text-align:center; color:#555;">(Locked)</td>
                    </tr>`;
                });

                if (is104 && d.Parent_Hierarchy !== undefined) {
                    html += `<tr>
                        <td><input type="text" class="h-key" value="Parent_Hierarchy" disabled style="color:#888;"></td>
                        <td><input type="text" class="h-val" value="${this.esc(String(d.Parent_Hierarchy ?? ''))}"></td>
                        <td><button class="btn btn-gray" style="height:35px;padding:0 8px;" onclick="this.closest('tr').remove()">Del</button></td>
                    </tr>`;
                }

                if (is104a) {
                    customKeys.forEach(k => {
                        const val = typeof d[k] === 'object' ? JSON.stringify(d[k]) : String(d[k] ?? '');
                        html += `<tr>
                            <td><input type="text" class="h-key" value="${this.esc(k)}"></td>
                            <td><input type="text" class="h-val" value="${this.esc(val)}"></td>
                            <td><button class="btn btn-gray" style="height:35px;padding:0 8px;" onclick="this.closest('tr').remove()">Del</button></td>
                        </tr>`;
                    });
                } else if (!is104) {
                    customKeys.forEach(k => {
                        const val = typeof d[k] === 'object' ? JSON.stringify(d[k]) : String(d[k] ?? '');
                        html += `<tr>
                            <td><input type="text" value="${this.esc(k)}" disabled style="color:#888;"></td>
                            <td><input type="text" value="${this.esc(val)}" disabled style="color:#888;"></td>
                            <td style="text-align:center; color:#555;">(Locked)</td>
                        </tr>`;
                    });
                }

                html += `</table>`;
                if (is104a) {
                    html += `<button class="btn btn-gray" style="margin-top:10px;" onclick="app.addHeaderRow()">+ Add Custom Header</button>`;
                } else if (is104 && d.Parent_Hierarchy === undefined) {
                    html += `<button class="btn btn-gray" style="margin-top:10px;" onclick="app.addParentHierarchyRow()">+ Add Parent_Hierarchy</button>`;
                }
                html += `</div><div class="modal-footer">
                    <button class="btn btn-gray" onclick="app.closeModal()">Cancel</button>
                    ${(is104a || is104) ? '<button class="btn" onclick="app.saveHeaders()">Save Headers</button>' : ''}
                </div>`;
                this.showModal(html, "modal-lg");
            },

            addHeaderRow: function() {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td><input type="text" class="h-key" placeholder="Header_Name (PascalCase)"></td>
                    <td><input type="text" class="h-val" placeholder="Value"></td>
                    <td><button class="btn btn-gray" style="height:35px;padding:0 8px;" onclick="this.closest('tr').remove()">Del</button></td>`;
                document.getElementById('header-table').appendChild(tr);
            },

            addParentHierarchyRow: function() {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td><input type="text" class="h-key" value="Parent_Hierarchy" disabled style="color:#888;"></td>
                    <td><input type="text" class="h-val" placeholder="../104a.mfdb.bejson"></td>
                    <td><button class="btn btn-gray" style="height:35px;padding:0 8px;" onclick="this.closest('tr').remove()">Del</button></td>`;
                document.getElementById('header-table').appendChild(tr);
            },

            saveHeaders: function() {
                const ver = appState.dbData.Format_Version;
                const rows = document.querySelectorAll('#header-table tr');
                const nh = {
                    Format: "BEJSON",
                    Format_Version: ver,
                    Format_Creator: appState.dbData.Format_Creator || "Elton Boehnen"
                };

                let hasError = false;
                rows.forEach((row, i) => {
                    if (i === 0) return;
                    const inputs = row.querySelectorAll('input');
                    if (inputs.length === 2) {
                        const k = inputs[0].value.trim();
                        const v = inputs[1].value;
                        if (!k || MANDATORY_HEADERS.has(k)) return;

                        if (ver === "104") {
                            if (k === "Parent_Hierarchy") {
                                nh["Parent_Hierarchy"] = v;
                            } else {
                                alert(`BEJSON 104 forbids custom header '${k}'.`);
                                hasError = true;
                            }
                        } else if (ver === "104a") {
                            if (k === "Parent_Hierarchy") {
                                nh["Parent_Hierarchy"] = v;
                            } else if (!PASCAL_CASE_RE.test(k)) {
                                alert(`Header '${k}' is invalid. BEJSON 104a custom headers must be in PascalCase (e.g., 'Schema_Name', 'DB_Name').`);
                                hasError = true;
                            } else {
                                try { nh[k] = JSON.parse(v); } catch(e) { nh[k] = v; }
                            }
                        }
                    }
                });

                if (hasError) return;

                nh.Records_Type = appState.dbData.Records_Type;
                nh.Fields       = appState.dbData.Fields;
                nh.Values       = appState.dbData.Values;

                const vRes = validateDocument(nh);
                if (!vRes.valid) {
                    alert("Header validation error:\n" + vRes.errors.map(e => e.message).join("\n"));
                    return;
                }

                appState.dbData = nh;
                this.closeModal();
                this.markDirty();
                this.saveDatabase();
            },

                appState.activeRecordType = recordType;
                appState.checkboxes       = {};
                appState.selectedFieldIdx = null;

                this.clearTopBar();
                if (appState.is104Mode) {
                    this.addTopBtn("Close File", "btn-gray", () => this.closeDatabase(), false);

                this.addTopText(recordType + verLabel);

                    ? () => { this.closeSidebar(); this.closeDatabase(); }

                    { label: '💾 Save As…',          action: () => { this.closeSidebar(); this.saveDatabaseAs(); } },

                    { label: '✂ Delete Selected Field', action: () => { this.closeSidebar(); const s=document.getElementById('editor-action'); if(s)s.value='Delete Selected Field'; this.execEditorAction(); } },
                    { label: '＋ Add Record',         action: () => { this.closeSidebar(); const s=document.getElementById('editor-action'); if(s)s.value='Add New Record'; this.execEditorAction(); } },
                    { label: '✂ Delete Selected Record(s)', action: () => { this.closeSidebar(); const s=document.getElementById('editor-action'); if(s)s.value='Delete Selected Record(s)'; this.execEditorAction(); } },
                    { label: '⧉ Duplicate Selected', action: () => { this.closeSidebar(); const s=document.getElementById('editor-action'); if(s)s.value='Duplicate Selected Record'; this.execEditorAction(); } },
                    { label: '📋 Copy Active Value', action: () => { this.closeSidebar(); const s=document.getElementById('editor-action'); if(s)s.value='Copy Active Value'; this.execEditorAction(); } },
                    { label: '📥 Paste to Active',   action: () => { this.closeSidebar(); const s=document.getElementById('editor-action'); if(s)s.value='Paste to Active'; this.execEditorAction(); } },
                    { label: '↺ Reset Sort & Pin',   action: () => { this.closeSidebar(); this.resetView(); } },
                    { label: '📋 View Schema',        action: () => { this.closeSidebar(); this.showSchemaView(); } },
                    ...(!appState.is104Mode ? [{ label: '📤 Export to 104', action: () => { this.closeSidebar(); this.export104(appState.activeRecordType); } }] : []),
                    ...(appState.is104aMode ? [{ label: '🗂 Manage Headers', action: () => { this.closeSidebar(); this.manageHeadersAction(); } }] : []),
                    { label: 'ℹ App Info',           action: () => { this.closeSidebar(); this.showAppInfo(); } },
                ]);

                let recordCount = 0;
                if (appState.is104Mode) {
                    recordCount = appState.dbData.Values.length;
                } else {
                    const rtpIdx = this.getFieldIndex('Record_Type_Parent');
                    recordCount = appState.dbData.Values.filter(v => v[rtpIdx] === recordType).length;
                }

                const badge = document.createElement('span');
                badge.className   = 'record-count-badge';
                badge.textContent = `${recordCount} record${recordCount !== 1 ? 's' : ''}`;
                document.getElementById('top-bar-left').appendChild(badge);

                const div = document.createElement('div');
                div.className = 'actions-container';
                div.innerHTML = `
                    <div class="actions-container" style="display:inline-flex;">
                        ${!appState.is104Mode ? `
                            <label style="white-space:nowrap; user-select:none; font-size:13px; margin-right:4px;">
                                <input type="checkbox" id="chk-sys" ${appState.showSysFields ? 'checked' : ''} onchange="app.toggleSysFields(this.checked)"> Show RTP
                            </label>
                        ` : ''}
                        <select id="editor-action" style="flex-grow:1; min-width:160px;">
                            <option value="" disabled selected>Action...</option>
                            <optgroup label="Record Actions">
                                <option>Add New Record</option>
                                <option>Delete Selected Record(s)</option>
                                <option>Duplicate Selected Record</option>
                                <option>Copy Active Value</option>
                                <option>Paste to Active</option>
                            </optgroup>
                            <optgroup label="View Actions">
                                <option>Reset Sort &amp; Pin</option>
                                <option>View Schema</option>
                            </optgroup>
                            <optgroup label="Field Actions">
                                <option>Add Field</option>
                                <option>Edit Selected Field</option>
                                <option>Delete Selected Field</option>
                            </optgroup>
                            <optgroup label="File Actions">
                                ${appState.is104aMode ? '<option>Manage Headers</option>' : ''}
                                ${!appState.is104Mode ? '<option>Export to BEJSON 104</option>' : ''}
                                <option>Save As...</option>
                                <option>App Info</option>
                            </optgroup>
                        </select>
                        <button class="btn" onclick="app.execEditorAction()">OK</button>
                    </div>`;
                document.getElementById('top-bar-right').appendChild(div);

                let fields = [];
                if (appState.is104Mode) {
                    fields = appState.dbData.Fields.map((f, i) => ({ ...f, orgIdx: i }));
                } else {
                    fields = appState.dbData.Fields.map((f, i) => ({ ...f, orgIdx: i }))
                        .filter(f => {
                            const isRtp = f.name === 'Record_Type_Parent';
                            const matchType = f.Record_Type_Parent === recordType;
                            return (isRtp && appState.showSysFields) || matchType;
                        });
                }

                if (appState.pinnedFieldIdx !== null) {
                    const pin = fields.find(f => f.orgIdx === appState.pinnedFieldIdx);
                    if (pin) {
                        fields = fields.filter(f => f.orgIdx !== appState.pinnedFieldIdx);
                        fields.unshift(pin);
                    }
                }

                let records = [];
                if (appState.is104Mode) {
                    records = appState.dbData.Values.map((v, i) => ({ val: v, orgIdx: i }));
                } else {
                    const rtpIdx = this.getFieldIndex('Record_Type_Parent');
                    records = appState.dbData.Values
                        .map((v, i) => ({ val: v, orgIdx: i }))
                        .filter(r => r.val[rtpIdx] === recordType);
                }

                let t = `<div class="table-wrapper"><table><thead><tr>`;
                t += `<th class="row-check"><input type="checkbox" onchange="app.toggleSelectAll(this.checked)"></th>`;
                t += `<th class="row-num">#</th>`;
                fields.forEach(f => {
                    const isPinned = f.orgIdx === appState.pinnedFieldIdx;
                    const pinCls   = isPinned ? 'pinned' : '';
                    const sortIco  = isPinned ? (appState.sortAsc ? ' &#9650;' : ' &#9660;') : '';
                    t += `<th><button class="header-btn ${pinCls}" id="hdr-${f.orgIdx}"
                            onclick="app.selectField(${f.orgIdx})"
                            oncontextmenu="app.headerContextMenu(event, ${f.orgIdx})">
                            ${this.esc(f.name)}${sortIco}<br><small>(${f.type}) <span style="opacity:0.5;">#${f.orgIdx}</span></small>
                        </button></th>`;
                });
                t += `</tr></thead><tbody>`;

                if (records.length === 0) {
                    t += `<tr><td colspan="${fields.length + 2}" style="padding:24px; text-align:center; color:#888;">No records. Use Action → Add New Record.</td></tr>`;
                } else {
                    records.forEach((row, rIdx) => {
                        const bg = rIdx % 2 === 0 ? 'row-even' : 'row-odd';
                        t += `<tr>`;
                        t += `<td class="row-check ${bg}"><input type="checkbox" class="rec-chk" data-idx="${row.orgIdx}"></td>`;
                        t += `<td class="row-num ${bg}">${rIdx + 1}</td>`;
                        fields.forEach(f => {
                            const val       = row.val[f.orgIdx];
                            const isRtp     = f.name === 'Record_Type_Parent';
                            const pinnedCls = f.orgIdx === appState.pinnedFieldIdx ? 'pinned-col' : '';
                            const hasVal    = val !== null && val !== undefined && val !== '';

                            if (f.type === 'boolean') {
                                const dis = isRtp ? 'disabled style="opacity:0.6"' : '';
                                t += `<td class="${bg} ${pinnedCls}" style="text-align:center;">
                                    <input type="checkbox" ${val ? 'checked' : ''} ${dis}
                                        onchange="app.updateValue(${row.orgIdx}, ${f.orgIdx}, this.checked)">
                                </td>`;
                            } else if (hasVal && (f.name === 'File_Path' || f.name === 'Path')) {
                                const sv = this.esc(String(val));
                                const fn = this.escapeJsString(f.name);
                                t += `<td class="${bg} ${pinnedCls}">
                                    <button class="sf-link" title="${sv}" onclick="app.sfOpenPath('${this.escapeJsString(sv)}', ${row.orgIdx}, ${f.orgIdx}, '${fn}')">${sv}</button>
                                </td>`;
                            } else if (hasVal && f.name === 'Image_Path') {
                                const sv = this.esc(String(val));
                                t += `<td class="${bg} ${pinnedCls}">
                                    <button class="sf-link" title="${sv}" onclick="app.sfOpenImage('${this.escapeJsString(sv)}', ${f.orgIdx})">${sv}</button>
                                </td>`;
                            } else {
                                const sv  = (val === null || val === undefined) ? '' : this.esc(String(val));
                                const dis = isRtp ? 'disabled style="opacity:0.6"' : '';
                                const fn  = this.escapeJsString(f.name);
                                t += `<td class="${bg} ${pinnedCls}">
                                    <input type="text" class="cell-input" value="${sv}" ${dis}
                                        onchange="app.updateValue(${row.orgIdx}, ${f.orgIdx}, this.value)"
                                        ondblclick="app.cellExpandOpen(this, ${row.orgIdx}, ${f.orgIdx}, '${fn}')"
                                        oncontextmenu="app.inputContextMenu(event, this, ${row.orgIdx}, ${f.orgIdx}, '${fn}')"
                                        ontouchstart="app.cellTouchStart(event, this, ${row.orgIdx}, ${f.orgIdx}, '${fn}')"
                                        ontouchmove="app.cellTouchMove(event)"
                                        ontouchend="app.cellTouchEnd(event)">
                                </td>`;
                            }
                        });
                        t += `</tr>`;
                    });
                }
                t += `</tbody></table></div>`;
                document.getElementById('main-frame').innerHTML = t;
            },

            closeDatabase: function() {
                Object.assign(appState, {
                    dbData: null, fileHandle: null, fileName: null,
                    is104Mode: false, is104aMode: false, originalVersion: null,
                    pinnedFieldIdx: null, isDirty: false
                });
                this.markClean();
                this.updateSidebarNav([
                    { label: 'ℹ App Info', action: () => { this.closeSidebar(); this.showAppInfo(); } },
                ]);
                const fnEl = document.getElementById('sb-filename');
                if (fnEl) fnEl.style.display = 'none';
                this.renderMainHub();
            },

            migrateLegacyData: function() {
                const d = appState.dbData;
                if (!d || d.Format_Version !== "104db") return;
                const LEGACY_RT     = 'Gemini_Keys';
                const LEGACY_FIELDS = new Set(['System_Record_Identifier','Version','Last_Modified','AppStateJSON','api_key']);

                if (d.Records_Type.includes(LEGACY_RT)) {
                    const ri = d.Fields.findIndex(f => f.name === 'Record_Type_Parent');
                    if (ri > -1) d.Values = d.Values.filter(r => r[ri] !== LEGACY_RT);
                    d.Records_Type = d.Records_Type.filter(t => t !== LEGACY_RT);
                }
                const idIdx = d.Fields.findIndex(f => f.name === 'System_Record_Identifier');
                if (idIdx > -1) d.Values = d.Values.filter(r => r[idIdx] !== '__DATABASE_METADATA__');

                d.Fields
                    .map((f, i) => LEGACY_FIELDS.has(f.name) ? i : -1)
                    .filter(i => i !== -1).sort((a,b) => b - a)
                    .forEach(i => { d.Fields.splice(i, 1); d.Values.forEach(row => row.splice(i, 1)); });
            },

            // --- UNIVERSAL FILE INPUT FALLBACK (Android / Firefox / Safari / file:// support) ---
            fileInputFallback: function(acceptStr = ".bejson,.json,application/json,text/plain,*/*") {
                return new Promise((resolve, reject) => {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = acceptStr;
                    input.style.position = 'fixed';
                    input.style.top = '-10000px';
                    input.style.left = '-10000px';
                    input.style.opacity = '0';
                    document.body.appendChild(input);

                    input.onchange = async () => {
                        try {
                            if (input.files && input.files.length > 0) {
                                const file = input.files[0];
                                const text = await file.text();
                                if (input.parentNode) input.parentNode.removeChild(input);
                                resolve({ file, text });
                            } else {
                                if (input.parentNode) input.parentNode.removeChild(input);
                                reject({ name: 'AbortError', message: 'No file selected' });
                            }
                        } catch (err) {
                            if (input.parentNode) input.parentNode.removeChild(input);
                            reject(err);
                        }
                    };

                    input.oncancel = () => {
                        if (input.parentNode) input.parentNode.removeChild(input);
                        reject({ name: 'AbortError', message: 'File picking canceled' });
                    };

                    input.click();
                });
            },
            openDatabaseFile: async function() {
                try {
                    let file = null, text = null, fileName = null;
                    appState.fileHandle = null;

                    if (typeof window.showOpenFilePicker === 'function') {
                        try {
                            const [handle] = await window.showOpenFilePicker({
                                types: [{ description: 'BEJSON Files', accept: BEJSON_ACCEPT }]
                            });
                            file = await handle.getFile();
                            text = await file.text();
                            fileName = file.name;
                            appState.fileHandle = handle;
                        } catch (fsaErr) {
                            if (fsaErr && fsaErr.name === 'AbortError') return;
                            const res = await this.fileInputFallback();
                            file = res.file; text = res.text; fileName = file.name;
                            appState.fileHandle = null;
                        }
                    } else {
                        const res = await this.fileInputFallback();
                        file = res.file; text = res.text; fileName = file.name;
                        appState.fileHandle = null;
                    }

                    if (!text) return;

                    let json;
                    try {
                        json = JSON.parse(text);
                    } catch (pe) {
                        return alert("Invalid JSON file: " + pe.message);
                    }

                    if (!json || typeof json !== "object" || json.Format !== "BEJSON") {
                        return alert("Not a valid BEJSON file (Format must be 'BEJSON').");
                    }

                    appState.fileName       = fileName;
                    appState.dbData         = json;
                    appState.pinnedFieldIdx = null;
                    this.markClean();

                    const ver = json.Format_Version || "";
                    if (ver === "104db") {
                        appState.is104Mode = false;
                        appState.is104aMode = false;
                        appState.originalVersion = "104db";
                        this.migrateLegacyData();
                        this.ensureIntegrity();
                        this.renderDatabaseHub();
                    } else if (ver === "104" || ver === "104a") {
                        appState.is104Mode  = true;
                        appState.is104aMode = (ver === "104a");
                        appState.originalVersion = ver;
                        if (!json.Records_Type || json.Records_Type.length !== 1) {
                            alert("Warning: BEJSON " + ver + " file should have exactly 1 record type. Fixing...");
                            if (!Array.isArray(json.Records_Type) || json.Records_Type.length === 0) {
                                json.Records_Type = ["DefaultType"];
                            } else {
                                json.Records_Type = [json.Records_Type[0]];
                            }
                        }
                        const rt = json.Records_Type[0];
                        appState.activeRecordType = rt;
                        this.ensureIntegrity();
                        this.renderRecordEditor(rt);
                    } else {
                        alert("Unknown or unsupported BEJSON version: " + ver);
                    }

                    const vRes = validateDocument(appState.dbData);
                    if (!vRes.valid) {
                        console.warn("Validation warnings on open:", vRes.errors);
                    }
                } catch (e) {
                    if (e && e.name !== 'AbortError') {
                        console.error(e);
                        alert("Error opening file: " + e.message);
                    }
                }
            },

            createNewFileDialog: async function() {

                        <input type="text" id="new-fname" placeholder="my_data.bejson">

            finishCreate: async function() {

                const format = document.getElementById('new-format').value;
                const rt     = document.getElementById('new-rt').value.trim() || "DefaultType";
